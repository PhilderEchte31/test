<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="description" content="Searchless – eine minimalistische, schnelle Suchoberfläche." />
  <title>Searchless — Search smarter</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --bg-2: #e9eef8;
      --surface: rgba(255,255,255,.72);
      --surface-solid: #ffffff;
      --surface-hover: rgba(0,113,227,.07);
      --text: #111827;
      --muted: #667085;
      --border: rgba(17,24,39,.09);
      --accent: #0071e3;
      --accent-2: #005bb5;
      --accent-soft: rgba(0,113,227,.12);
      --shadow: 0 24px 80px rgba(31,41,55,.14);
      --shadow-small: 0 10px 30px rgba(31,41,55,.10);
      --blur: blur(24px) saturate(150%);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    body.dark {
      color-scheme: dark;
      --bg: #0b0d11;
      --bg-2: #171b24;
      --surface: rgba(24,28,38,.72);
      --surface-solid: #181c25;
      --surface-hover: rgba(10,132,255,.13);
      --text: #f5f7fb;
      --muted: #9ca3af;
      --border: rgba(255,255,255,.10);
      --accent: #0a84ff;
      --accent-2: #409cff;
      --accent-soft: rgba(10,132,255,.16);
      --shadow: 0 28px 90px rgba(0,0,0,.42);
      --shadow-small: 0 12px 36px rgba(0,0,0,.30);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(0,113,227,.16), transparent 34rem),
        radial-gradient(circle at 0% 100%, rgba(120,80,255,.09), transparent 28rem),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      transition: background .45s ease, color .3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.28), transparent 65%);
      opacity: .5;
    }

    button, input { font: inherit; }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 7vh, 76px) 18px 24px;
    }

    .hero {
      width: min(900px, 100%);
      text-align: center;
      animation: rise .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--text);
    }

    .logo img {
      display: block;
      width: auto;
      height: clamp(48px, 6vw, 68px);
      max-width: min(82vw, 360px);
      object-fit: contain;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      font-size: .78rem;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    .subtitle {
      max-width: 560px;
      margin: 4px auto 0;
      color: var(--muted);
      font-size: clamp(.95rem, 1.8vw, 1.08rem);
      line-height: 1.65;
      letter-spacing: .005em;
    }

    .search-shell {
      width: min(820px, 100%);
      margin-top: clamp(26px, 5vh, 48px);
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius-xl) + 8px);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      animation: rise .85s .08s cubic-bezier(.2,.8,.2,1) both;
    }

    .search-form {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 72px;
    }

    .search-icon {
      position: absolute;
      left: 23px;
      width: 22px;
      height: 22px;
      color: var(--muted);
      pointer-events: none;
      transition: color .2s ease, transform .2s ease;
    }

    .search-form:focus-within .search-icon {
      color: var(--accent);
      transform: scale(1.05);
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 66px;
      padding: 0 58px 0 58px;
      border: 1px solid transparent;
      outline: none;
      border-radius: var(--radius-lg);
      color: var(--text);
      background: var(--surface-solid);
      box-shadow: inset 0 0 0 1px rgba(17,24,39,.035), 0 4px 16px rgba(0,0,0,.045);
      font-size: clamp(1rem, 2.3vw, 1.12rem);
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }

    body.dark #searchInput {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.045), 0 5px 18px rgba(0,0,0,.22);
    }

    #searchInput::placeholder {
      color: var(--muted);
    }

    #searchInput:focus {
      border-color: rgba(0,113,227,.28);
      box-shadow: 0 0 0 4px var(--accent-soft), 0 8px 24px rgba(0,0,0,.08);
    }

    .clear-btn {
      position: absolute;
      right: 168px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, background .18s ease, color .18s ease;
    }

    .clear-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .clear-btn:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .search-button {
      flex: 0 0 auto;
      height: 66px;
      min-width: 100px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: var(--radius-lg);
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(0,113,227,.26);
      cursor: pointer;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0,113,227,.34);
      filter: saturate(1.08);
    }

    .search-button:active {
      transform: translateY(0) scale(.985);
    }

    .search-button svg {
      width: 19px;
      height: 19px;
    }

    .suggestions {
      position: fixed;
      z-index: 99999;
      max-height: min(390px, 55vh);
      overflow-y: auto;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 16px 48px rgba(0,0,0,.22);
      text-align: left;
      opacity: 0;
      transform: translateY(-5px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      /* No backdrop-filter here – must stay fully opaque */
    }

    body.dark .suggestions {
      background: #1c2030;
      border-color: rgba(255,255,255,.12);
      box-shadow: 0 16px 48px rgba(0,0,0,.55);
    }

    .suggestions.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .suggestion-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 10px 12px;
      border: 0;
      border-radius: 13px;
      color: var(--text);
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: .96rem;
      transition: background .14s ease, transform .14s ease;
    }

    .suggestion-item::before {
      content: "";
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      opacity: .7;
    }

    .suggestion-item.is-history::before {
      border-radius: 4px;
    }

    .suggestion-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .suggestion-note {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
      opacity: .8;
    }

    .suggestion-item:hover,
    .suggestion-item[aria-selected="true"] {
      background: var(--surface-hover);
    }

    .suggestion-item[aria-selected="true"] {
      transform: translateX(2px);
    }

    .history-shell {
      width: min(820px, 100%);
      margin-top: 16px;
      animation: fade .8s .12s ease both;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .history-title {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .history-clear {
      border: 0;
      padding: 2px 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .78rem;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color .16s ease;
    }

    .history-clear:hover {
      color: var(--accent);
    }

    .history-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      overflow: hidden;
      transition: border-color .16s ease, background .16s ease;
    }

    .history-chip:hover {
      border-color: rgba(0,113,227,.3);
    }

    .history-chip-query {
      max-width: 220px;
      padding: 8px 6px 8px 14px;
      border: 0;
      background: transparent;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      font-size: .82rem;
    }

    .history-chip-remove {
      width: 26px;
      height: 26px;
      margin-right: 6px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: background .14s ease, color .14s ease;
    }

    .history-chip-remove:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      animation: fade .8s .2s ease both;
    }

    #toggle-darkmode {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      cursor: pointer;
      font-size: .86rem;
      font-weight: 650;
      transition: background .18s ease, transform .18s ease, border-color .18s ease;
    }

    #toggle-darkmode:hover {
      background: var(--surface-hover);
      transform: translateY(-1px);
    }

    .features {
      width: min(820px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
      animation: rise .85s .16s cubic-bezier(.2,.8,.2,1) both;
    }

    .feature {
      padding: 20px 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      text-align: left;
      transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
    }

    .feature:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-small);
      border-color: rgba(0,113,227,.15);
    }

    .feature-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      margin-bottom: 10px;
      border-radius: 11px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .feature strong {
      display: block;
      margin-bottom: 5px;
      font-size: .92rem;
      letter-spacing: -.01em;
    }

    .feature span {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.5;
    }

    footer {
      width: min(900px, 100%);
      margin-top: 54px;
      padding-top: 0;
      color: var(--muted);
      text-align: center;
      font-size: .78rem;
      animation: fade 1s .3s ease both;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 700px) {
      .page {
        padding-top: 32px;
      }

      .search-shell {
        padding: 8px;
        border-radius: 26px;
      }

      .search-form {
        flex-direction: column;
        align-items: stretch;
      }

      #searchInput,
      .search-button {
        width: 100%;
      }

      .search-button {
        min-height: 56px;
        height: 56px;
      }

      .search-icon {
        top: 22px;
      }

      .clear-btn {
        top: 17px;
        right: 18px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .feature {
        text-align: center;
      }

      .feature-icon {
        margin-left: auto;
        margin-right: auto;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <a class="logo" href="/" aria-label="Searchless Startseite">
        <img src="https://i.ibb.co/0Rwk8422/searchless-logo-1.png" alt="Searchless" />
      </a>

      <p class="subtitle">
        Eine schnelle, minimalistische Suchoberfläche ohne unnötigen Ballast.
      </p>
    </section>

    <section class="search-shell" aria-label="Suche">
      <form
        class="search-form"
        action="https://www.google.com/search"
        method="GET"
        target="_self"
        id="searchForm"
        autocomplete="off"
      >
        <label class="sr-only" for="searchInput">Wonach suchst du?</label>

        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.75" stroke="currentColor" stroke-width="1.8"/>
          <path d="m16.2 16.2 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>

        <input
          type="text"
          name="q"
          id="searchInput"
          placeholder="Wonach suchst du?"
          aria-autocomplete="list"
          aria-controls="suggestions"
          aria-expanded="false"
          spellcheck="false"
          required
        />

        <button class="clear-btn" id="clearButton" type="button" aria-label="Suche löschen" title="Löschen">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
            <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <button class="search-button" type="submit" aria-label="Suchen">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.75" stroke="currentColor" stroke-width="1.8"/>
            <path d="m16.2 16.2 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>Suchen</span>
        </button>

      </form>


    </section>

    <section class="history-shell" id="historySection" aria-label="Letzte Suchen" hidden>
      <div class="history-header">
        <span class="history-title">Letzte Suchen</span>
        <button class="history-clear" id="clearHistoryButton" type="button">Verlauf löschen</button>
      </div>
      <div class="history-chips" id="historyChips"></div>
    </section>

    <div class="controls">
      <button id="toggle-darkmode" type="button" aria-label="Darstellung wechseln">
        <span id="themeIcon" aria-hidden="true">☾</span>
        <span id="themeLabel">Dark Mode</span>
      </button>
    </div>

    <section class="features" aria-label="Eigenschaften">
      <article class="feature">
        <div class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
            <path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <strong>Minimalistisch</strong>
        <span>Nur das, was du zum Suchen brauchst.</span>
      </article>

      <article class="feature">
        <div class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
            <path d="M13 2 5 13h6l-1 9 8-11h-6l1-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </div>
        <strong>Schnell</strong>
        <span>Direkte Suche mit intelligenten Vorschlägen.</span>
      </article>

      <article class="feature">
        <div class="feature-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
            <path d="M12 3a8.5 8.5 0 1 0 8.5 8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M12 3v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <strong>Dein Look</strong>
        <span>Light & Dark Mode werden automatisch gespeichert.</span>
      </article>
    </section>

    <footer>
      © 2026 <a href="/" aria-label="Searchless">Searchless</a>
    </footer>
  </main>

  <!-- Suggestions rendered at body level to escape backdrop-filter stacking context -->
  <div
    id="suggestions"
    class="suggestions"
    role="listbox"
    aria-label="Suchvorschläge"
  ></div>

  <script>
    (() => {
      "use strict";

      const body = document.body;
      const toggle = document.getElementById("toggle-darkmode");
      const themeIcon = document.getElementById("themeIcon");
      const themeLabel = document.getElementById("themeLabel");
      const input = document.getElementById("searchInput");
      const form = document.getElementById("searchForm");
      const box = document.getElementById("suggestions");
      const clearButton = document.getElementById("clearButton");
      const historySection = document.getElementById("historySection");
      const historyChips = document.getElementById("historyChips");
      const clearHistoryButton = document.getElementById("clearHistoryButton");

      const HISTORY_KEY = "searchless-history-v1";
      const MAX_HISTORY = 8;

      let selectedIndex = -1;
      let suggestions = [];
      let debounceTimer = null;
      let requestToken = 0;

      function safeStorageGet(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch {
          return fallback;
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {}
      }

      function getHistory() {
        try {
          const parsed = JSON.parse(safeStorageGet(HISTORY_KEY, "[]"));
          return Array.isArray(parsed)
            ? parsed.filter(item => typeof item === "string" && item.trim()).slice(0, MAX_HISTORY)
            : [];
        } catch {
          return [];
        }
      }

      function saveHistory(query) {
        const clean = query.trim();
        if (!clean) return;
        const next = [clean, ...getHistory().filter(item => item.toLowerCase() !== clean.toLowerCase())].slice(0, MAX_HISTORY);
        safeStorageSet(HISTORY_KEY, JSON.stringify(next));
        renderHistoryChips();
      }

      function removeHistoryItem(query) {
        const next = getHistory().filter(item => item !== query);
        safeStorageSet(HISTORY_KEY, JSON.stringify(next));
        renderHistoryChips();
      }

      function clearHistory() {
        safeStorageSet(HISTORY_KEY, "[]");
        renderHistoryChips();
      }

      function renderHistoryChips() {
        const history = getHistory();
        historySection.hidden = history.length === 0;
        historyChips.replaceChildren();

        history.forEach(query => {
          const chip = document.createElement("span");
          chip.className = "history-chip";

          const queryButton = document.createElement("button");
          queryButton.type = "button";
          queryButton.className = "history-chip-query";
          queryButton.textContent = query;
          queryButton.title = query;
          queryButton.addEventListener("click", () => {
            input.value = query;
            updateClearButton();
            closeSuggestions();
            input.focus();
            form.requestSubmit();
          });

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "history-chip-remove";
          remove.setAttribute("aria-label", `„${query}“ aus Verlauf entfernen`);
          remove.innerHTML = "&times;";
          remove.addEventListener("click", (event) => {
            event.stopPropagation();
            removeHistoryItem(query);
          });

          chip.append(queryButton, remove);
          historyChips.appendChild(chip);
        });
      }

      function renderLocalSuggestions(query) {
        const normalized = query.toLowerCase();
        const matches = getHistory().filter(item => item.toLowerCase().includes(normalized));
        if (matches.length) {
          renderSuggestions(matches, "Letzte Suchen");
          return true;
        }
        return false;
      }

      function setTheme(theme) {
        const isDark = theme === "dark";
        body.classList.toggle("dark", isDark);
        themeIcon.textContent = isDark ? "☀" : "☾";
        themeLabel.textContent = isDark ? "Light Mode" : "Dark Mode";
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      }

      const storedTheme = localStorage.getItem("theme");
      const preferredTheme = storedTheme ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      setTheme(preferredTheme);

      toggle.addEventListener("click", () => {
        setTheme(body.classList.contains("dark") ? "light" : "dark");
      });

      function updateClearButton() {
        clearButton.classList.toggle("visible", input.value.length > 0);
      }

      function closeSuggestions() {
        box.classList.remove("open");
        input.setAttribute("aria-expanded", "false");
        selectedIndex = -1;
      }

      function positionSuggestions() {
        const inputRect = input.getBoundingClientRect();
        const btnRect   = form.querySelector(".search-button").getBoundingClientRect();
        box.style.top   = (inputRect.bottom + 10) + "px";
        box.style.left  = inputRect.left + "px";
        box.style.width = (btnRect.left - inputRect.left - 10) + "px";
      }

      function openSuggestions() {
        if (!suggestions.length) return;
        positionSuggestions();
        box.classList.add("open");
        input.setAttribute("aria-expanded", "true");
      }

      window.addEventListener("resize", () => { if (box.classList.contains("open")) positionSuggestions(); });
      window.addEventListener("scroll", () => { if (box.classList.contains("open")) positionSuggestions(); }, true);

      function renderSuggestions(items, sourceLabel = "Vorschläge") {
        box.replaceChildren();
        suggestions = items.slice(0, 8);
        selectedIndex = -1;

        const isHistory = sourceLabel === "Letzte Suchen";

        suggestions.forEach((text, index) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "suggestion-item" + (isHistory ? " is-history" : "");
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", "false");

          const label = document.createElement("span");
          label.className = "suggestion-text";
          label.textContent = text;

          const note = document.createElement("span");
          note.className = "suggestion-note";
          note.textContent = isHistory ? "Verlauf" : "Vorschlag";

          item.append(label, note);

          item.addEventListener("mousedown", (event) => {
            event.preventDefault();
            selectSuggestion(index);
          });

          box.appendChild(item);
        });

        if (suggestions.length) openSuggestions();
        else closeSuggestions();
      }

      function updateSelection() {
        [...box.children].forEach((item, index) => {
          const active = index === selectedIndex;
          item.setAttribute("aria-selected", String(active));
          if (active) item.scrollIntoView({ block: "nearest" });
        });
      }

      function selectSuggestion(index) {
        if (!suggestions[index]) return;
        input.value = suggestions[index];
        updateClearButton();
        closeSuggestions();
        form.requestSubmit();
      }

      async function fetchSuggestions(query) {
        const token = ++requestToken;

        // Remove any previous JSONP script
        const old = document.getElementById("__suggest_script");
        if (old) old.remove();

        // Global callback for JSONP – Google calls this when the script loads
        window.__suggestCallback = function(data) {
          if (token !== requestToken) return;
          const items = Array.isArray(data?.[1]) ? data[1] : [];
          renderSuggestions(
            items.filter(item => typeof item === "string" && item.trim())
                 .map(item => item.trim())
          );
        };

        const script = document.createElement("script");
        script.id = "__suggest_script";
        script.src =
          "https://suggestqueries.google.com/complete/search" +
          "?client=firefox&hl=de&callback=__suggestCallback&q=" +
          encodeURIComponent(query);
        script.onerror = () => { if (token === requestToken) closeSuggestions(); };
        document.body.appendChild(script);

        // Clean up script tag after response
        setTimeout(() => { if (document.body.contains(script)) script.remove(); }, 2000);
      }

      input.addEventListener("input", () => {
        updateClearButton();
        const query = input.value.trim();

        clearTimeout(debounceTimer);
        requestToken++;

        if (!query) {
          closeSuggestions();
          return;
        }

        debounceTimer = setTimeout(() => {
          if (!renderLocalSuggestions(query)) {
            fetchSuggestions(query);
          }
        }, 160);
      });

      input.addEventListener("focus", () => {
        if (!input.value.trim()) {
          const history = getHistory();
          if (history.length) renderSuggestions(history.slice(0, 6), "Letzte Suchen");
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" && suggestions.length) {
          event.preventDefault();
          selectedIndex = (selectedIndex + 1) % suggestions.length;
          openSuggestions();
          updateSelection();
        }

        if (event.key === "ArrowUp" && suggestions.length) {
          event.preventDefault();
          selectedIndex = selectedIndex <= 0
            ? suggestions.length - 1
            : selectedIndex - 1;
          openSuggestions();
          updateSelection();
        }

        if (event.key === "Enter" && selectedIndex >= 0) {
          event.preventDefault();
          selectSuggestion(selectedIndex);
        }

        if (event.key === "Escape") {
          closeSuggestions();
        }
      });

      clearButton.addEventListener("click", () => {
        input.value = "";
        updateClearButton();
        closeSuggestions();
        input.focus();
      });

      form.addEventListener("submit", () => {
        const query = input.value.trim();
        if (query) saveHistory(query);
        closeSuggestions();
      });

      clearHistoryButton.addEventListener("click", () => {
        clearHistory();
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".search-form")) {
          closeSuggestions();
        }
      });

      window.addEventListener("storage", (event) => {
        if (event.key === "theme" && (event.newValue === "light" || event.newValue === "dark")) {
          setTheme(event.newValue);
        }
        if (event.key === HISTORY_KEY) {
          renderHistoryChips();
        }
      });

      renderHistoryChips();
    })();
  </script>
</body>
</html>
